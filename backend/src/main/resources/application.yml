spring:
  application:
    name: vidsage
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # 建连失败（DNS / TCP 握手）要快速暴露，不该耗着
      connect-timeout: 10s
      # 读超时。LLM 清洗/翻译/摘要、术语查证、ASR 结果下载四处共用——它们都从 Boot 自动配置的
      # RestClient.Builder 建客户端。取 120s 是比 Spring AI 给 OpenAI 的默认 60s 宽一档
      # （长 prompt 长输出，高峰期首字延迟几十秒），又比 DashScope SDK 的 300s 紧。
      # 是 clients（复数）：单数 spring.http.client.* 在 Boot 4.0.0 起已废弃，
      # 两者配置描述一模一样，抄错了不报错、只是不生效。
      read-timeout: 120s
  servlet:
    multipart:
      # 用户上传本地视频 / 音频文件：给足上限。超限被容器拒绝，
      # 不要为了省事调小——长视频素材普遍数百 MB 到数 GB
      max-file-size: 2GB
      max-request-size: 2GB
  ai:
    # 读超时抛的 ResourceAccessException 在重试白名单里，默认 10 次会把 120s 放大成
    # 约 44 分钟才收敛（那条 run 一直占着互斥与并发闸门）。收到 3 次后最坏约 6-9 分钟。
    retry:
      max-attempts: 3
    # LLM 供应商单开关：deepseek | openai。没有 mimo 这个值——mimo 兼容 OpenAI 协议，
    # 走 openai 自动配置，供应商由 base-url 决定。高峰期切 mimo 改成 openai，低谷期改回 deepseek。
    model:
      chat: deepseek
    deepseek:
      # 字幕清洗 / 摘要 / 翻译的 LLM 调用
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: deepseek-chat
        # 翻译要求术语与称谓稳定，温度不宜过高
        temperature: 0.3
    openai:
      # 小米 Mimo 的 OpenAI 兼容端点；开关指到 deepseek 时本段闲置不生效
      api-key: ${MIMO_API_KEY:}
      base-url: https://api.xiaomimimo.com/v1
      chat:
        model: mimo-v2.6-flash
        # 同 deepseek：术语与称谓要稳定
        temperature: 0.3



vidsage:
  task:
    # 同时执行的异步管线任务上限；超出者保持 PENDING 排队（SemaphoreTaskConcurrencyGate 的 Semaphore 限流）
    max-concurrent: 2
  asr:
    # ASR提供者：本地或云端
    provider: cloud
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      model: qwen-audio-3.1-asr-flash-filetrans
      # 单次转写操作的总时长上限——管的是「整个转写最多等多久」，不是「单次 HTTP 请求等多久」
      # （后者走 spring.http.clients.read-timeout）。DashScope 是异步批处理，2 小时音频大致
      # 5-10 分钟，15 分钟留一档余量；素材普遍更长时调大即可。
      transcription-timeout: 15m
  tools:
    # 外部工具（yt-dlp / ffmpeg / ffprobe）；留空则从 PATH 解析。
    # 容器里 ffmpeg 未必在 PATH，交付时必须显式配置，不要把本机绝对路径写进仓库
    yt-dlp-path: ${YT_DLP_PATH:}
    # 一处配置、两处使用：既供 Java 抽音频，也作为 yt-dlp 的 --ffmpeg-location
    ffmpeg-path: ${FFMPEG_PATH:}
    ffprobe-path: ${FFPROBE_PATH:}
    # 外部命令默认超时（秒），调用方未显式指定时使用
    default-timeout-seconds: 300
    # yt-dlp 版本距今超过该天数即告警（不自动更新）
    yt-dlp-freshness-warn-days: 90
  workspace:
    # 任务工作目录根；单任务子目录按内容寻址生成，目录可删
    root: ${VIDSAGE_WORKSPACE_ROOT:./data/works}
  term-lookup:
    # 术语官方译名联网查证
    provider: dashscope
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      model: qwen3.7-flash
  download:
    yt-dlp:
      # B站未登录时的风控边界未实测；部分站点需登录态时，指定导出的 Netscape 格式 cookies 文件
      cookies-file: ${YT_DLP_COOKIES_FILE:}
  subtitle:
    cleanup:
      # 一句字幕最多几毫秒。超过就会被切分器切开
      max-segment-ms: 8000
      # 一次丢给 LLM 修正多少句（一「批」）
      batch-size: 20
      # 一次最多多少字
      max-batch-chars: 600
      # 纠错最多重来几轮：模型回得不对（掉行/改过头），让它再改，最多 3 次
      max-steps: 3
      # 跨批对话历史的字符上限：把前几批的「批次原文 + 已采纳的纠正结果」作为多轮历史带给后续批次，
      # 让模型看得见自己前面把专有名词定成了什么写法。累计超过就从最老的一轮开始丢。
      # 一轮往返约 1400 字（600 字批），20000 ≈ 14 轮 ≈ 280 句；设为 0 关闭，退回「每批独立」。
      # 注意代价：每批都要重发全部历史，输入 token 总量随「批数 × 本上限」增长。
      history-max-chars: 20000
      # 长句（>10字）的「最小改动」底线：改完与原句相似度必须 ≥ 0.7，否则判「改太狠」→ 重来
      similarity-normal: 0.7
      # 短句（≤10字）的底线，放宽到 0.3
      similarity-short-text: 0.3
    translate:
      # 目标语种（BCP-47 短码）。源语种与它相同则跳过翻译，不调用 LLM
      target-language: zh
      # 一次丢给 LLM 翻译多少句（一「批」）；与 max-batch-chars 双判据，先到为准。
      # 批的句数比清洗那边少：翻译的输出会膨胀，而真正控「单次请求输出体量」的旋钮是**句数**、
      # 不是字符上限（翻译的输入与清洗同源，所以只调字符上限不会改变批的句数）。
      batch-size: 12
      # 一次最多多少字。它是**次级护栏**：高于实测均值 285，常规素材不抢跑；靠它兜住长句密集素材
      # （清洗实测出现过 20 句 542 字）。翻译的字符预算应小于清洗的 600——翻译是膨胀任务。
      max-batch-chars: 400
      # 翻译最多重来几轮：模型回得不对（掉行/空译文），让它再改，最多 3 次
      max-steps: 3
      # 跨批对话历史的字符上限（语义同清洗）：把前几批的「批次原文 + 已采纳的译文」作为多轮历史
      # 带给后续批次，是「术语与称谓全片一致」的主要载体。累计超过就从最老的一轮开始丢。
      # 一轮往返约 1000 字（400 字批 + 膨胀译文），20000 ≈ 20 轮；设为 0 关闭，退回「每批独立」。
      history-max-chars: 20000

logging:
  level:
    root: INFO
    # 业务包开 DEBUG：转写是秒级外部调用，服务层与 Provider 的中间节点日志
    # 是定位「卡在哪一步」的关键；线上单独下调到 INFO
    com.vidsage: DEBUG