spring:
  application:
    name: vidsage
  threads:
    virtual:
      enabled: true
  ai:
    deepseek:
      # 翻译走 LLM 唯一路线（DeepSeek，OpenAI 兼容）；key 一律走环境变量，不写真实密钥
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          # 翻译要求术语与称谓稳定，温度不宜过高
          temperature: 0.3

vidsage:
  asr:
    # 本地 FunASR 供应商为规划项；当前默认走云端
    provider: cloud
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      model: qwen-audio-3.1-asr-flash-filetrans
  llm:
    # DeepSeek 为首个 LLM 实现；后续如加本地模型，增加对应实现后在此切换
    provider: deepseek