# 测试专用配置：覆盖主配置，避免上下文加载依赖真实外部密钥
spring:
  ai:
    deepseek:
      api-key: test-key
      chat:
        options:
          model: deepseek-chat

vidsage:
  asr:
    provider: cloud
    dashscope:
      api-key: test-key
  subtitle:
    cleanup:
      max-segment-ms: 8000
      # 缺这个键会绑成 0 → 每批退化成 1 句，静默的行为漂移
      max-batch-chars: 600
      batch-size: 20
      max-steps: 3
      similarity-normal: 0.7
      similarity-short-text: 0.3
      # 缺这个键会绑成 0 → 跨批历史在容器路径上静默关闭
      history-max-chars: 20000